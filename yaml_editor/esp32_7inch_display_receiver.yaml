# -------------------------------------------------------------
# 7-INCH ESP32-P4 MASTER ALARM RECEIVER DISPLAY
# Target Chip: ESP32-P4 (1024x600 MIPI-DSI Display + ESP32-C6 Wi-Fi)
# Comms: Dual ESP-NOW Direct MAC Receiver + UDP Port 4444 Broadcast
# Visual Display: 18 Digital Input Zones (Solid GREEN for ON, Solid RED for OFF)
# -------------------------------------------------------------
substitutions:
  device_name: esp32-7inch-p4-display
  friendly_name: "7-Inch ESP32-P4 Alarm Display"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  includes:
    - p4_receiver.h

esp32:
  board: esp32-p4-evboard
  variant: esp32p4
  engineering_sample: true
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: yes
    sdkconfig_options:
      CONFIG_SPIRAM_SPEED_80M: "y"
      CONFIG_CACHE_L2_CACHE_256KB: "y"
      CONFIG_CACHE_L2_CACHE_LINE_128B: "y"

# Power regulators for ESP32-P4 MIPI-DSI & Peripherals
esp_ldo:
  - channel: 3
    voltage: 2.5V
  - channel: 4
    voltage: 1.8V

# PSRAM required for 1024x600 display framebuffer
psram:
  mode: hex
  speed: 100MHZ

# Backlight control for the 7" LCD (GPIO23 PWM @ 20kHz)
output:
  - platform: ledc
    pin: GPIO23
    id: gpio_backlight_pwm
    frequency: 20kHz
    zero_means_zero: true

light:
  - platform: monochromatic
    output: gpio_backlight_pwm
    name: "Display Backlight"
    id: display_backlight
    restore_mode: ALWAYS_ON

logger:
  level: INFO

# Enable ESP32-C6 Hosted co-processor for Wi-Fi & ESP-NOW
esp32_hosted:
  variant: ESP32C6
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  active_high: true

# Wireless Wi-Fi Configuration with Fast Static IP
wifi:
  ssid: "H824"
  password: "gw202001"
  manual_ip:
    static_ip: 192.168.3.30
    gateway: 192.168.3.1
    subnet: 255.255.255.0
  fast_connect: true

# Fast ESP-NOW & UDP Polling Loop (50 Hz)
interval:
  - interval: 20ms
    then:
      - lambda: |-
          if (global_p4_receiver != nullptr) {
            global_p4_receiver->loop();
          }

api:
ota:
  - platform: esphome

# Web Server (Version 2)
web_server:
  port: 80
  version: 2
  auth:
    type: basic
    username: "admin"
    password: "password123"

# -------------------------------------------------------------
# WI-FI SIGNAL STRENGTH (RSSI) SENSOR
# -------------------------------------------------------------
sensor:
  - platform: wifi_signal
    name: "Wi-Fi Signal Strength"
    id: wifi_signal_dbm
    update_interval: 3s

# -------------------------------------------------------------
# 18 DIGITAL INPUT RECEIVER SENSORS
# -------------------------------------------------------------
binary_sensor:
  - platform: template
    name: "DI 01 | Pin L05 (D4)"
    id: di_01_gw
  - platform: template
    name: "DI 02 | Pin L08 (D5)"
    id: di_02_gw
  - platform: template
    name: "DI 03 | Pin R04 (D12)"
    id: di_03_gw
  - platform: template
    name: "DI 04 | Pin R03 (D13)"
    id: di_04_gw
  - platform: template
    name: "DI 05 | Pin R05 (D14)"
    id: di_05_gw
  - platform: template
    name: "DI 06 | Pin L03 (D15)"
    id: di_06_gw
  - platform: template
    name: "DI 07 | Pin L06 (RX2)"
    id: di_07_gw
  - platform: template
    name: "DI 08 | Pin L07 (TX2)"
    id: di_08_gw
  - platform: template
    name: "DI 09 | Pin L09 (D18)"
    id: di_09_gw
  - platform: template
    name: "DI 10 | Pin L10 (D19)"
    id: di_10_gw
  - platform: template
    name: "DI 11 | Pin L11 (D21)"
    id: di_11_gw
  - platform: template
    name: "DI 12 | Pin L14 (D22)"
    id: di_12_gw
  - platform: template
    name: "DI 13 | Pin L15 (D23)"
    id: di_13_gw
  - platform: template
    name: "DI 14 | Pin R08 (D25)"
    id: di_14_gw
  - platform: template
    name: "DI 15 | Pin R07 (D26)"
    id: di_15_gw
  - platform: template
    name: "DI 16 | Pin R06 (D27)"
    id: di_16_gw
  - platform: template
    name: "DI 17 | Pin R10 (D32)"
    id: di_17_gw
  - platform: template
    name: "DI 18 | Pin R09 (D33)"
    id: di_18_gw

# -------------------------------------------------------------
# HIGH-QUALITY TYPOGRAPHY & COLOR PALETTE
# -------------------------------------------------------------
font:
  - file: 'gfonts://Roboto'
    id: font_tiny
    size: 11
  - file: 'gfonts://Roboto'
    id: font_small
    size: 14
  - file: 'gfonts://Roboto'
    id: font_medium
    size: 18
  - file: 'gfonts://Roboto'
    id: font_header
    size: 20
  - file: 'gfonts://Roboto'
    id: font_large
    size: 28

color:
  - id: c_bg
    red: 0.08
    green: 0.09
    blue: 0.12
  - id: c_header
    red: 0.07
    green: 0.13
    blue: 0.22
  - id: c_border
    red: 0.22
    green: 0.25
    blue: 0.32
  - id: c_card_bg
    red: 0.12
    green: 0.14
    blue: 0.18
  - id: c_green
    red: 0.0
    green: 0.88
    blue: 0.32
  - id: c_red
    red: 0.95
    green: 0.22
    blue: 0.22
  - id: c_yellow
    red: 1.0
    green: 0.82
    blue: 0.0
  - id: c_cyan
    red: 0.0
    green: 0.82
    blue: 1.0
  - id: c_white
    red: 1.0
    green: 1.0
    blue: 1.0
  - id: c_gray
    red: 0.70
    green: 0.72
    blue: 0.75
  - id: c_muted
    red: 0.45
    green: 0.48
    blue: 0.52

# -------------------------------------------------------------
# 1024x600 MIPI-DSI LCD DISPLAY ENGINE (18-ZONE ALARM MONITOR)
# -------------------------------------------------------------
display:
  - platform: mipi_dsi
    model: JC1060P470
    id: my_display
    reset_pin: GPIO05
    dimensions:
      width: 1024
      height: 600
    update_interval: 1s
    lambda: |-
      Color bg_color = id(c_bg);
      Color header_color = id(c_header);
      Color card_color = id(c_card_bg);
      Color border_color = id(c_border);
      Color text_white = id(c_white);
      Color text_cyan = id(c_cyan);
      Color text_gray = id(c_gray);
      Color text_muted = id(c_muted);
      Color status_green = id(c_green);
      Color status_red = id(c_red);
      Color status_yellow = id(c_yellow);

      // 1. CLEAR SCREEN / BACKGROUND
      it.fill(bg_color);

      // -------------------------------------------------------------
      // 2. TOP HEADER BAR (60px High)
      // -------------------------------------------------------------
      it.filled_rectangle(0, 0, 1024, 60, header_color);
      it.line(0, 60, 1024, 60, text_cyan);

      // Header Title
      it.print(18, 18, id(font_header), text_white, "18-ZONE ALARM MONITOR & RECEIVER");

      // Count active zones
      int active_count = 0;
      for (int i = 0; i < 18; i++) {
        bool active = false;
        if (global_p4_receiver != nullptr) {
          active = global_p4_receiver->di_states[i];
        }
        if (!active) {
          if (i == 0) active = id(di_01_gw).state;
          else if (i == 1) active = id(di_02_gw).state;
          else if (i == 2) active = id(di_03_gw).state;
          else if (i == 3) active = id(di_04_gw).state;
          else if (i == 4) active = id(di_05_gw).state;
          else if (i == 5) active = id(di_06_gw).state;
          else if (i == 6) active = id(di_07_gw).state;
          else if (i == 7) active = id(di_08_gw).state;
          else if (i == 8) active = id(di_09_gw).state;
          else if (i == 9) active = id(di_10_gw).state;
          else if (i == 10) active = id(di_11_gw).state;
          else if (i == 11) active = id(di_12_gw).state;
          else if (i == 12) active = id(di_13_gw).state;
          else if (i == 13) active = id(di_14_gw).state;
          else if (i == 14) active = id(di_15_gw).state;
          else if (i == 15) active = id(di_16_gw).state;
          else if (i == 16) active = id(di_17_gw).state;
          else if (i == 17) active = id(di_18_gw).state;
        }
        if (active) active_count++;
      }

      // Summary Status Badge in Header
      int status_badge_x = 440;
      int status_badge_y = 12;
      int status_badge_w = 230;
      int status_badge_h = 36;
      if (active_count > 0) {
        it.filled_rectangle(status_badge_x, status_badge_y, status_badge_w, status_badge_h, status_green);
        char act_txt[32];
        sprintf(act_txt, "ACTIVE: %d / 18 ON", active_count);
        it.print(status_badge_x + status_badge_w / 2, status_badge_y + 8, id(font_medium), bg_color, TextAlign::TOP_CENTER, act_txt);
      } else {
        it.filled_rectangle(status_badge_x, status_badge_y, status_badge_w, status_badge_h, card_color);
        it.rectangle(status_badge_x, status_badge_y, status_badge_w, status_badge_h, status_red);
        it.print(status_badge_x + status_badge_w / 2, status_badge_y + 8, id(font_medium), status_red, TextAlign::TOP_CENTER, "ALL 18 ZONES OFF");
      }

      // Wi-Fi RSSI / ESP-NOW Status
      if (id(wifi_signal_dbm).has_state()) {
        char rssi_buf[32];
        sprintf(rssi_buf, "RSSI: %.0f dBm", id(wifi_signal_dbm).state);
        it.print(685, 20, id(font_small), text_gray, rssi_buf);
      } else {
        it.print(685, 20, id(font_small), text_gray, "ESP-NOW ONLY");
      }

      // IP Address
      it.print(810, 20, id(font_small), text_gray, "IP: ");
      if (wifi::global_wifi_component != nullptr && !wifi::global_wifi_component->get_ip_addresses().empty()) {
        char ip_buf[32];
        wifi::global_wifi_component->get_ip_addresses()[0].str_to(ip_buf);
        it.print(835, 20, id(font_small), text_cyan, ip_buf);
      } else {
        it.print(835, 20, id(font_small), status_yellow, "192.168.3.30");
      }

      // Stream / Link Status Dot (Green if ESP-NOW or UDP packet received within 5s)
      uint32_t now = millis();
      bool stream_alive = (global_p4_receiver != nullptr && global_p4_receiver->last_packet_time > 0 && (now - global_p4_receiver->last_packet_time) < 6000);
      it.filled_circle(995, 28, 6, stream_alive ? status_green : status_red);

      // -------------------------------------------------------------
      // 3. 18-ZONE ALARM MATRIX (6 Columns x 3 Rows)
      // -------------------------------------------------------------
      const char* pin_names[] = {
        "D4 / L05", "D5 / L08", "D12 / R04", "D13 / R03", "D14 / R05", "D15 / L03",
        "RX2 / L06", "TX2 / L07", "D18 / L09", "D19 / L10", "D21 / L11", "D22 / L14",
        "D23 / L15", "D25 / R08", "D26 / R07", "D27 / R06", "D32 / R10", "D33 / R09"
      };

      int start_x = 18;
      int start_y = 72;
      int card_w = 158;
      int card_h = 162;
      int gap_x = 8;
      int gap_y = 12;

      for (int i = 0; i < 18; i++) {
        int col = i % 6;
        int row = i / 6;
        int x = start_x + col * (card_w + gap_x);
        int y = start_y + row * (card_h + gap_y);

        // Card Container Background & Border
        it.filled_rectangle(x, y, card_w, card_h, card_color);
        it.rectangle(x, y, card_w, card_h, border_color);

        // Zone Header
        char zone_lbl[16];
        sprintf(zone_lbl, "ZONE %02d", i + 1);
        it.print(x + 12, y + 10, id(font_medium), text_white, zone_lbl);
        it.print(x + card_w - 12, y + 14, id(font_tiny), text_gray, TextAlign::TOP_RIGHT, pin_names[i]);

        // State Check
        bool is_active = false;
        if (global_p4_receiver != nullptr) {
          is_active = global_p4_receiver->di_states[i];
        }
        if (!is_active) {
          if (i == 0) is_active = id(di_01_gw).state;
          else if (i == 1) is_active = id(di_02_gw).state;
          else if (i == 2) is_active = id(di_03_gw).state;
          else if (i == 3) is_active = id(di_04_gw).state;
          else if (i == 4) is_active = id(di_05_gw).state;
          else if (i == 5) is_active = id(di_06_gw).state;
          else if (i == 6) is_active = id(di_07_gw).state;
          else if (i == 7) is_active = id(di_08_gw).state;
          else if (i == 8) is_active = id(di_09_gw).state;
          else if (i == 9) is_active = id(di_10_gw).state;
          else if (i == 10) is_active = id(di_11_gw).state;
          else if (i == 11) is_active = id(di_12_gw).state;
          else if (i == 12) is_active = id(di_13_gw).state;
          else if (i == 13) is_active = id(di_14_gw).state;
          else if (i == 14) is_active = id(di_15_gw).state;
          else if (i == 15) is_active = id(di_16_gw).state;
          else if (i == 16) is_active = id(di_17_gw).state;
          else if (i == 17) is_active = id(di_18_gw).state;
        }

        // Indicator Box (138px x 105px)
        int box_x = x + 10;
        int box_y = y + 42;
        int box_w = card_w - 20;
        int box_h = 106;

        // SOLID GREEN FOR ON, SOLID RED FOR OFF
        if (is_active) {
          it.filled_rectangle(box_x, box_y, box_w, box_h, status_green);
          it.print(box_x + box_w / 2, box_y + 26, id(font_large), bg_color, TextAlign::TOP_CENTER, "ON");
          it.print(box_x + box_w / 2, box_y + 68, id(font_small), bg_color, TextAlign::TOP_CENTER, "ACTIVE");
        } else {
          it.filled_rectangle(box_x, box_y, box_w, box_h, status_red);
          it.print(box_x + box_w / 2, box_y + 26, id(font_large), text_white, TextAlign::TOP_CENTER, "OFF");
          it.print(box_x + box_w / 2, box_y + 68, id(font_small), text_white, TextAlign::TOP_CENTER, "IDLE");
        }
      }
