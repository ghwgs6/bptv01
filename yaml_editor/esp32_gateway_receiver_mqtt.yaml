# -------------------------------------------------------------
# BOARD 2: ESP-NOW RECEIVER & MQTT / WEB GATEWAY
#
# Web interface:
#   http://192.168.3.61/
#
# Display behaviour:
#   ON  = GREEN
#   OFF = RED
#
# MAC Address:
#   8C:94:DF:6D:43:DC
# -------------------------------------------------------------

esphome:
  name: esp32-gateway-receiver
  friendly_name: "ESP32 Receiver Gateway"

  includes:
    - esp_now_receiver.h


# -------------------------------------------------------------
# ESP32 HARDWARE
# -------------------------------------------------------------
esp32:
  board: esp32dev

  framework:
    type: arduino


# -------------------------------------------------------------
# LOGGING
# -------------------------------------------------------------
logger:
  level: DEBUG


# -------------------------------------------------------------
# WIFI
#
# Primary:
#   H824
#
# Secondary:
#   Pulse_Staff
#
# Static IP:
#   192.168.3.61
# -------------------------------------------------------------
wifi:

  networks:

    - ssid: "H824"
      password: "gw202001"
      priority: 10.0

    - ssid: "Pulse_Staff"
      password: "Pulse@1234"
      priority: 5.0

  fast_connect: true

  # -----------------------------------------------------------
  # STATIC IP
  #
  # IMPORTANT:
  # Change gateway/subnet below if your LAN uses different
  # settings.
  #
  # Typical 192.168.3.x LAN:
  # -----------------------------------------------------------
  manual_ip:
    static_ip: 192.168.3.61
    gateway: 192.168.3.1
    subnet: 255.255.255.0

  # -----------------------------------------------------------
  # START ESP-NOW RECEIVER AFTER WIFI CONNECTS
  # -----------------------------------------------------------
  on_connect:
    then:
      - lambda: |-
          static bool initialized = false;

          if (!initialized) {

            initialized = true;

            ESP_LOGI(
              "ESP-NOW",
              "WiFi connected. Initialising ESP-NOW receiver..."
            );

            auto *my_receiver =
              new ESPNowReceiverComponent();

            my_receiver->setup();
          }


  # -----------------------------------------------------------
  # FALLBACK ACCESS POINT
  # -----------------------------------------------------------
  ap:
    ssid: "ESP32-Gateway-Fallback"
    password: "fallbackpassword"


# -------------------------------------------------------------
# FALLBACK CONFIGURATION PORTAL
# -------------------------------------------------------------
captive_portal:


# -------------------------------------------------------------
# mDNS
#
# You may also be able to use:
#
# http://esp32-gateway-receiver.local/
# -------------------------------------------------------------
mdns:


# -------------------------------------------------------------
# ESPHOME WEB SERVER
#
# Browser:
#
# http://192.168.3.61/
#
# gateway.css is embedded into the ESP32 firmware.
# -------------------------------------------------------------
web_server:

  port: 80

  version: 2

  css_include: "gateway.css"

  auth:
    username: "admin"
    password: "password123"


# -------------------------------------------------------------
# 18 ESP-NOW RECEIVER BINARY SENSORS
#
# The actual state is supplied by:
#
# esp_now_receiver.h
#
# They are not local GPIO inputs on this receiver.
