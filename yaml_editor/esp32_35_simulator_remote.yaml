# -------------------------------------------------------------
# ESP32 3.5" TOUCHSCREEN SENSOR SIMULATOR & REMOTE TESTER
# Target Chip: ESP32-D0WD (3.5" ST7796 480x320 + XPT2046 Touch)
# Features: Tap for ON/OFF, Long-Press (2s) for BYPASS, [ALL ON], [ALL OFF], [CLR BYP], [CYCLE]
# -------------------------------------------------------------
substitutions:
  device_name: esp32-35-simulator-remote
  friendly_name: "ESP32 3.5\" Sensor Simulator Remote"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  includes:
    - esp_now_sender.h
  on_boot:
    priority: -100.0
    then:
      - light.turn_on:
          id: disp_backlight
          brightness: 100%
      - lambda: |-
          if (global_esp_now_sender != nullptr) {
            global_esp_now_sender->init();
          }

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Disable safe mode to prevent display lockout on rapid resets
safe_mode:
  disabled: true

# Wi-Fi configuration (multi-network with fallback AP)
wifi:
  networks:
    - ssid: "H824"
      password: "gw202001"
      priority: 10.0
    - ssid: "Pulse_Staff"
      password: "Pulse@1234"
      priority: 5.0
  fast_connect: true
  on_connect:
    then:
      - lambda: |-
          if (global_esp_now_sender != nullptr) {
            global_esp_now_sender->init();
          }
  ap:
    ssid: "ESP32-Remote-Fallback"
    password: "fallbackpassword"

api:
ota:
  - platform: esphome

logger:
  level: INFO

# -------------------------------------------------------------
# HARDWARE BACKLIGHT (LEDC PWM on GPIO27 @ 20kHz)
# -------------------------------------------------------------
output:
  - platform: ledc
    pin: GPIO27
    id: gpio_backlight_pwm
    frequency: 20kHz

light:
  - platform: monochromatic
    output: gpio_backlight_pwm
    name: "Display Backlight"
    id: disp_backlight
    restore_mode: ALWAYS_ON

# -------------------------------------------------------------
# SPI BUS (Shared between ST7796 Display and XPT2046 Touch)
# -------------------------------------------------------------
spi:
  - id: tft_spi
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12

# -------------------------------------------------------------
